[project]
name = "kamokamo"
version = "0.1.0"
description = "typed functional vocabulary for Python"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "samhain", email = "samhain@moonwit.ch" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["examples/**", "docs/**"]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "examples"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["kamokamo"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    { include-group = "test" },
    "basedpyright>=1.40.2",
    "mypy>=2.4.0",
    "pyinstrument>=5.1.3",
    "pyperf>=2.10.0",
    "pyright[nodejs]>=1.1.414",
    "ruff>=0.16.10",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "hypothesis>=6.168.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
